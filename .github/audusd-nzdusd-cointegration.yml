name: AUDUSD-NZDUSD Cointegration Test

# Manual-only. Phase 1 ONLY of the relative-value hypothesis: a real
# Engle-Granger cointegration test (OLS + Augmented Dickey-Fuller on
# residuals) between AUD/USD and NZD/USD. No trading rule is built, no
# backtest runs, and no live/forward-test code is touched. Per protocol,
# if this fails (not cointegrated), the hypothesis stops here -- no
# alternate lookbacks, hedge ratios, or pairs will be tried.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  audusd-nzdusd-cointegration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cointegration test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m bot.audusd_nzdusd_coint
