name: Confluence Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "2year (original test) or extended (full XAU history, same frozen spec, no changes)"
        required: false
        default: "2year"

permissions:
  contents: read
  actions: write

jobs:
  confluence-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run confluence strategy backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -c "
          import asyncio
          from bot.confluence_backtest import run, run_extended_xau
          mode = '${{ github.event.inputs.mode }}'
          asyncio.run(run_extended_xau() if mode == 'extended' else run())
          "
