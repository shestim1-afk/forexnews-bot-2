name: Confluence Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "2year (original XAU+BTC test), extended (full XAU history), or doge (DOGE/USD, same frozen spec)"
        required: false
        default: "2year"

permissions:
  contents: read
  actions: write

jobs:
  confluence-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run confluence strategy backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -c "
          import asyncio
          from bot.confluence_backtest import run, run_extended_xau, run_extended_dogecoin
          mode = '${{ github.event.inputs.mode }}'
          if mode == 'extended':
              asyncio.run(run_extended_xau())
          elif mode == 'doge':
              asyncio.run(run_extended_dogecoin())
          else:
              asyncio.run(run())
          "
