name: Confluence Strategy Backtest

# Manual-only. Frozen specification: 2-of-3 majority (Donchian breakout,
# 50/200 MA crossover, MACD), daily candles, 2-year window, XAU/USD and
# BTC/USD both reported. DELIBERATELY uses daily data (not intraday) so
# each instrument needs only a single API call -- designed to run in
# minutes, not hours, avoiding the pagination/rate-limit issues seen
# elsewhere in this project today. Does NOT touch bot/xau_swing.py or
# any live/forward-test code.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  confluence-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run confluence strategy backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m bot.confluence_backtest
