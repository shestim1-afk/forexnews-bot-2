name: Confluence Strategy Backtest

# Manual-only. Frozen specification: 2-of-3 majority (Donchian breakout,
# 50/200 MA crossover, MACD), daily candles. XAU/USD and BTC/USD tested
# first, then DOGE/USD as one additional honest data point, then a
# retroactive dev/OOS consistency check on DOGE. DELIBERATELY uses daily
# data (not intraday) so each instrument needs only a single API call --
# designed to run in minutes, not hours, avoiding the pagination/rate-
# limit issues seen elsewhere in this project today. Does NOT touch
# bot/xau_swing.py or any live/forward-test code.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "2year (XAU+BTC), extended (full XAU), doge (DOGE/USD), or dogesplit (DOGE dev/OOS check)"
        required: false
        default: "2year"

permissions:
  contents: read
  actions: write

jobs:
  confluence-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run confluence strategy backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -c "
          import asyncio
          from bot.confluence_backtest import run, run_extended_xau, run_extended_dogecoin, run_dogecoin_dev_oos_split
          mode = '${{ github.event.inputs.mode }}'
          if mode == 'extended':
              asyncio.run(run_extended_xau())
          elif mode == 'doge':
              asyncio.run(run_extended_dogecoin())
          elif mode == 'dogesplit':
              asyncio.run(run_dogecoin_dev_oos_split())
          else:
              asyncio.run(run())
          "
