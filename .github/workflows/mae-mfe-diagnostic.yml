name: MAE-MFE Diagnostic

# Manual-only. Purely diagnostic: analyzes already-collected backtest data
# (no new API calls) to answer whether the current exit structure is
# leaving real expectancy on the table, and reconstructs a small set of
# approximate counterfactual exit rules for comparison. Nothing here
# changes the live strategy or is "validated" -- see the report's own
# labeling (OBSERVED / COUNTERFACTUAL / HYPOTHESIS / VALIDATED).
on:
  workflow_dispatch:
    inputs:
      api_symbol:
        description: "Symbol/tag to analyze, e.g. 'XAU/USD [4h-ATR]' (must match a symbol tag already in the database)"
        required: false
        default: "XAU/USD [4h-ATR]"
      strategy_type:
        description: "trend / range / liquidity_sweep / breakout_retest"
        required: false
        default: "trend"
      spread_pct:
        description: "Round-trip spread cost as % of price (leave blank for a rough default)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  mae-mfe-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore shared database
        uses: actions/cache@v4
        with:
          path: data/seen.sqlite3
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Run MAE/MFE diagnostic report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import asyncio
          from bot.analytics import run_mae_mfe_diagnostic_report
          spread = '${{ github.event.inputs.spread_pct }}'.strip().replace(',', '.')
          asyncio.run(run_mae_mfe_diagnostic_report(
              api_symbol='${{ github.event.inputs.api_symbol }}',
              strategy_type='${{ github.event.inputs.strategy_type }}',
              spread_pct=float(spread) if spread else None,
          ))
          "
