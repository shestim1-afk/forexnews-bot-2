name: Cost-Adjusted Analysis

# Manual-only. Recomputes your existing backtest results assuming a
# realistic spread cost per trade, using each trade's own real entry/SL
# distance -- answers "does the edge survive contact with real trading
# costs" using data you've already collected, no new API calls needed.
on:
  workflow_dispatch:
    inputs:
      api_symbol:
        description: "Symbol to analyze (e.g. BTC/USD, XAU/USD, GBP/JPY)"
        required: false
        default: "BTC/USD"
      spread_pct:
        description: "Round-trip spread cost as % of price (leave blank to use a rough default per symbol -- replace with your real broker's spread for a meaningful answer)"
        required: false
        default: ""
      strategy_type:
        description: "Optional: check a single custom strategy type (e.g. vol_compression) instead of the 4 default detection engines (trend/range/liquidity_sweep/breakout_retest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  cost-adjusted-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore shared database
        uses: actions/cache@v4
        with:
          path: data/seen.sqlite3
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Run cost-adjusted analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import asyncio
          from bot.analytics import run_cost_adjusted_report
          spread = '${{ github.event.inputs.spread_pct }}'.strip().replace(',', '.')
          strategy_type = '${{ github.event.inputs.strategy_type }}'.strip()
          asyncio.run(run_cost_adjusted_report(
              api_symbol='${{ github.event.inputs.api_symbol }}',
              spread_pct=float(spread) if spread else None,
              strategy_types=[strategy_type] if strategy_type else None,
          ))
          "
