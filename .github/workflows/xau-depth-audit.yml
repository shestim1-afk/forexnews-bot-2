name: XAU 10-Year Depth Audit

# Manual-only. Checks whether ~10 years of real XAU/USD 4h data is
# actually available via Twelve Data, before committing to a full
# extended backtest. Does NOT change or test any strategy -- feasibility
# check only. Production bot untouched.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  xau-depth-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run XAU depth audit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m bot.xau_depth_audit
