name: Insider Cluster-Buying Backtest

# Manual-only. Frozen specification: 3+ distinct insiders filing
# open-market purchases (SEC Form 4, transaction code 'P') within a
# 5-day window, at any of ~50 curated large-cap tickers. 21-trading-day
# hold, 0.10% round-trip cost. Development period only unless explicitly
# run with period=oos after development is reviewed and approved.
# Does NOT touch bot/xau_swing.py or any live/forward-test code.
#
# NOTE ON RUNTIME: this makes many individual SEC EDGAR requests (one per
# Form 4 filing, across ~50 tickers) with a deliberate delay between each
# to respect SEC's fair-access guidance. This can take significantly
# longer than other workflows in this project -- the generous timeout
# below is intentional, not a sign something is wrong if it runs long.
on:
  workflow_dispatch:
    inputs:
      period:
        description: "dev or oos -- only run oos after dev is reviewed and approved as DEVELOPMENT PROMISING"
        required: false
        default: "dev"

permissions:
  contents: read
  actions: write

jobs:
  insider-cluster-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run insider cluster-buying backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -c "
          import asyncio
          from bot.insider_cluster import run_period
          asyncio.run(run_period(period='${{ github.event.inputs.period }}'))
          "
