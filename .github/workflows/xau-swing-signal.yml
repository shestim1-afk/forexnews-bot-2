name: XAU 4H-Swing Forward Test - Signal Check

# Runs every 4 hours, matching the timeframe the SL/TP is sized on -- the
# validated configuration, isolated risk tracking, forward-test only.
on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"  # 5 min past every 4th hour, UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  xau-swing-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore shared database
        uses: actions/cache@v4
        with:
          path: data/seen.sqlite3
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Check for a new XAU 4H-swing signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
          XAU_SWING_RISK_PCT: ${{ secrets.XAU_SWING_RISK_PCT }}
        run: python -m bot.xau_swing
