name: Historical Backtest

# Manual-only. Choose the symbol and (new) which timeframe's ATR sets the
# SL/TP width -- '5m' is the live bot's tight, scalp-style default; '1h'
# or '4h' produce wider, swing-style stops meant to survive real spread
# costs better, at the cost of holding trades longer and getting fewer
# per day.
on:
  workflow_dispatch:
    inputs:
      api_symbol:
        description: "Symbol in Twelve Data format (e.g. BTC/USD, XAU/USD, GBP/JPY)"
        required: false
        default: "BTC/USD"
      display_symbol:
        description: "How it should appear in the Telegram message"
        required: false
        default: "BTC/USD"
      atr_timeframe:
        description: "Which timeframe's ATR sets SL/TP width: 5m (live default, tight) / 15m / 1h / 4h (wider, swing-style)"
        required: false
        default: "5m"
      sl_mult:
        description: "Stop-loss distance, as a multiple of the chosen timeframe's ATR"
        required: false
        default: "1.5"
      tp1_mult:
        description: "TP1 distance, as a multiple of ATR"
        required: false
        default: "1.0"
      tp2_mult:
        description: "TP2 distance, as a multiple of ATR"
        required: false
        default: "2.0"
      deep_start_date:
        description: "Deep backtest start date, YYYY-MM-DD (leave blank for the fast ~17-day default)"
        required: false
        default: ""
      deep_end_date:
        description: "Deep backtest end date, YYYY-MM-DD (leave blank for the fast ~17-day default)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore shared database
        uses: actions/cache@v4
        with:
          path: data/seen.sqlite3
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Run historical backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -c "
          import asyncio
          from bot.historical_backtest import run
          deep_start = '${{ github.event.inputs.deep_start_date }}' or None
          deep_end = '${{ github.event.inputs.deep_end_date }}' or None
          asyncio.run(run(
              api_symbol='${{ github.event.inputs.api_symbol }}',
              display_symbol='${{ github.event.inputs.display_symbol }}',
              sl_mult=float('${{ github.event.inputs.sl_mult }}'),
              tp1_mult=float('${{ github.event.inputs.tp1_mult }}'),
              tp2_mult=float('${{ github.event.inputs.tp2_mult }}'),
              deep_start_date=deep_start,
              deep_end_date=deep_end,
              atr_timeframe='${{ github.event.inputs.atr_timeframe }}',
          ))
          "
